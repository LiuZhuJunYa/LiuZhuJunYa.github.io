server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the original escaped request URI. Captures from $uri/location regexes
    # are decoded and would put raw UTF-8 bytes into Chinese redirect headers.
    if ($request_uri ~ "^([^?]+)/([?].*)?$") {
        return 301 $1$is_args$args;
    }

    # Valaxy's SSG emits article.html for extensionless article URLs.
    location / {
        try_files $uri.html $uri/index.html $uri =404;
    }

    error_page 404 /404.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
